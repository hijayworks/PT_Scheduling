name: Sync CSP build artifact

on:
  push:
    branches: [security/csp-strict-styles]

permissions:
  contents: write

jobs:
  sync-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/csp-strict-styles
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - name: Commit generated script.js when changed
        run: |
          if git diff --quiet -- script.js; then
            echo "script.js already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js
          git -c core.hooksPath=/dev/null commit -m "build: sync strict CSP bundle"
          git push origin HEAD:security/csp-strict-styles
