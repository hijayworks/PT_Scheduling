name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: script.js가 src/ 최신 빌드 결과와 일치하는지 검사
        run: |
          npm run build
          git diff --exit-code -- script.js || {
            echo "::error::script.js가 src/와 어긋납니다. 'npm run build'를 실행하고 결과를 커밋하세요.";
            exit 1;
          }
      - run: npm run lint
      - name: 스모크 테스트 (체인DP/후보A는 시간이 오래 걸려 건너뜀)
        run: SMOKE_SKIP_A=1 npm test
